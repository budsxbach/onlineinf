<circle cx="658" cy="190" r="4.5" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="658" y="164" class="v" text-anchor="middle">S1 · 150 A</text>
<text x="588" y="144" class="s" text-anchor="middle">Hauptsicherung, max. 20 cm ab Zelle</text>
<line x1="662" y1="190" x2="715" y2="190" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>

<!-- Vorladezweig -->
<path d="M608,194 L608,250 L612,250" fill="none" stroke="#475569" stroke-width="3"/>
<rect x="612" y="236" width="58" height="28" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="641" y="255" font-size="11.5" text-anchor="middle" fill="#0f172a">6,8 Ω</text>
<path d="M670,250 L700,250 L700,194" fill="none" stroke="#475569" stroke-width="3"/>
<circle cx="685" cy="250" r="4" fill="#fff" stroke="#475569" stroke-width="2"/>
<text x="530" y="352" class="s">Vorladen: Taster 2–3 s,</text>
<text x="530" y="370" class="s">dann S1 schließen.</text>

<!-- ═════════ DC-Schienen ═════════ -->
<line x1="715" y1="190" x2="715" y2="556" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>
<line x1="775" y1="320" x2="775" y2="556" stroke="#111827" stroke-width="7" stroke-linecap="round"/>
<text x="690" y="400" font-size="10.5" font-weight="700" text-anchor="end" fill="#475569">DC-BUS</text>

<!-- ═════════ INVERTER ═════════ -->
<line x1="715" y1="190" x2="880" y2="190" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
<line x1="775" y1="320" x2="880" y2="320" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
<rect x="880" y="150" width="240" height="188" rx="10" class="box"/>
<text x="896" y="178" class="h">INVERTER / LADER</text>
<text x="896" y="204" class="t">bidirektional, 2000 W</text>
<text x="896" y="226" class="s">DC 36–50 V ↔ AC 230 V</text>
<text x="896" y="246" class="s">Entladen 2000 W (≈ 53 A)</text>
<text x="896" y="264" class="s">Laden 1500 W aus dem Netz</text>
<text x="896" y="282" class="s">Wirkungsgrad ≈ 90 %</text>
<text x="896" y="304" class="s">Lüfter + Temperaturschutz</text>
<text x="896" y="324" class="s">Kühlkörper frei anströmen</text>

<!-- ═════════ AC-Ausgang ═════════ -->
<line x1="1120" y1="220" x2="1152" y2="220" stroke="#c2410c" stroke-width="5" stroke-linecap="round"/>
<rect x="1150" y="150" width="158" height="188" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="1164" y="178" class="h" fill="#c2410c">AC-AUSGANG</text>
<text x="1164" y="204" class="t">230 V / 50 Hz</text>
<text x="1164" y="226" class="s">FI 30 mA + LS 16 A</text>
<text x="1164" y="244" class="s">Schuko + CEE blau</text>
<text x="1164" y="262" class="s">PE am Gehäuse</text>
<text x="1164" y="284" class="s">2000 W dauerhaft</text>
<text x="1164" y="304" class="s">Motoren: 3× Anlauf</text>
<text x="1164" y="322" class="s">→ max. ≈ 650 W</text>

<!-- ═════════ DC-DC 12 V ═════════ -->
<line x1="715" y1="440" x2="800" y2="440" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
<circle cx="775" cy="440" r="9" fill="#ffffff"/>
