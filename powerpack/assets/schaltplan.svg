</style></defs>
<rect width="1330" height="930" fill="#ffffff"/>

<text x="40" y="46" font-size="25" font-weight="700" fill="#0f172a">Powerpack 2 kW — Systemschaltplan</text>
<text x="40" y="74" font-size="13.5" fill="#475569">13S LiFePO4 · 48-V-Klasse · 2000-W-Bidirektionalinverter · BMS mit gemeinsamer Plusklemme (B+ = P+)</text>
<line x1="40" y1="92" x2="1290" y2="92" stroke="#e2e8f0" stroke-width="2"/>

<!-- ═════════ AKKUPACK ═════════ -->
<rect x="40" y="150" width="204" height="188" rx="10" class="box"/>
<text x="56" y="178" class="h">AKKUPACK</text>
<rect x="56" y="192" width="9" height="30" rx="1.5" fill="#cbd5e1" stroke="#334155" stroke-width="1"/><rect x="69" y="192" width="9" height="30" rx="1.5" fill="#cbd5e1" stroke="#334155" stroke-width="1"/><rect x="82" y="192" width="9" height="30" rx="1.5" fill="#cbd5e1" stroke="#334155" stroke-width="1"/><rect x="95" y="192" width="9" height="30" rx="1.5" fill="#cbd5e1" stroke="#334155" stroke-width="1"/><rect x="108" y="192" width="9" height="30" rx="1.5" fill="#cbd5e1" stroke="#334155" stroke-width="1"/><rect x="121" y="192" width="9" height="30" rx="1.5" fill="#cbd5e1" stroke="#334155" stroke-width="1"/><rect x="134" y="192" width="9" height="30" rx="1.5" fill="#cbd5e1" stroke="#334155" stroke-width="1"/><rect x="147" y="192" width="9" height="30" rx="1.5" fill="#cbd5e1" stroke="#334155" stroke-width="1"/><rect x="160" y="192" width="9" height="30" rx="1.5" fill="#cbd5e1" stroke="#334155" stroke-width="1"/><rect x="173" y="192" width="9" height="30" rx="1.5" fill="#cbd5e1" stroke="#334155" stroke-width="1"/><rect x="186" y="192" width="9" height="30" rx="1.5" fill="#cbd5e1" stroke="#334155" stroke-width="1"/><rect x="199" y="192" width="9" height="30" rx="1.5" fill="#cbd5e1" stroke="#334155" stroke-width="1"/><rect x="212" y="192" width="9" height="30" rx="1.5" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
<text x="56" y="250" class="t">13S × 3,2 V LiFePO4</text>
<text x="56" y="272" class="s">41,6 V nominal</text>
<text x="56" y="290" class="s">47,5 V voll · 36,4 V leer</text>
<text x="56" y="314" class="t">100 Ah · 4,16 kWh</text>
<text x="56" y="334" class="s">Zellverbinder 25 mm²</text>

<line x1="244" y1="190" x2="300" y2="190" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
<line x1="244" y1="252" x2="300" y2="252" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
<text x="272" y="180" class="v" fill="#dc2626" text-anchor="middle">B+</text>
<text x="272" y="274" class="v" fill="#111827" text-anchor="middle">B−</text>

<!-- ═════════ BMS ═════════ -->
<rect x="300" y="150" width="180" height="188" rx="10" class="box"/>
<text x="316" y="178" class="h">BMS</text>
<text x="316" y="202" class="s">13S · ≥ 100 A Dauerstrom</text>
<text x="316" y="222" class="s">Zellspannung überwacht</text>
<text x="316" y="242" class="s">Kurzschluss · Temperatur</text>
<text x="316" y="262" class="s">Balancer für 13S</text>
<text x="316" y="286" class="s">schaltet die Minus-Seite</text>
<text x="316" y="306" class="s">B+ und P+ sind gebrückt</text>
<text x="316" y="326" class="s">Sensorleitung 14-polig</text>

<line x1="480" y1="190" x2="520" y2="190" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
<line x1="480" y1="320" x2="700" y2="320" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
<circle cx="715" cy="320" r="9" fill="#ffffff"/>
<text x="492" y="180" class="v" fill="#dc2626">P+</text>
<text x="492" y="308" class="v" fill="#111827">P−</text>

<!-- ═════════ F1 Hauptsicherung ═════════ -->
<rect x="520" y="172" width="56" height="36" rx="5" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
<line x1="524" y1="190" x2="572" y2="190" stroke="#dc2626" stroke-width="2.5"/>
<text x="548" y="195" class="v" text-anchor="middle" fill="#dc2626">F1</text>
<text x="548" y="164" class="v" text-anchor="middle" fill="#dc2626">100 A ANL</text>

<!-- ═════════ S1 Trennschalter ═════════ -->
<line x1="576" y1="190" x2="612" y2="190" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
<circle cx="616" cy="190" r="4.5" fill="#fff" stroke="#0f172a" stroke-width="2"/>
