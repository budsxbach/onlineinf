<text x="826" y="414" class="s" text-anchor="middle">30 A</text>
<line x1="852" y1="440" x2="880" y2="440" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
<circle cx="715" cy="492" r="9" fill="#ffffff"/>
<line x1="775" y1="492" x2="880" y2="492" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
<rect x="880" y="408" width="240" height="118" rx="10" class="box"/>
<text x="896" y="434" class="h">DC-DC-WANDLER</text>
<text x="896" y="458" class="t">48 V → 12 V, 20 A</text>
<text x="896" y="480" class="s">versorgt USB und 12-V-Dose</text>
<text x="896" y="500" class="s">nicht für Wechselrichterlast</text>

<line x1="1120" y1="466" x2="1152" y2="466" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
<rect x="1150" y="408" width="158" height="118" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="1164" y="434" class="h" fill="#1d4ed8">12 V / USB</text>
<text x="1164" y="458" class="t">12-V-Dose 10 A</text>
<text x="1164" y="480" class="s">USB-C PD 100 W</text>
<text x="1164" y="500" class="s">2× USB-A 18 W</text>

<!-- ═════════ Optionales Ladegerät ═════════ -->
<rect x="40" y="408" width="330" height="164" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2" stroke-dasharray="9 6"/>
<text x="58" y="434" class="h" fill="#c2410c">OPTIONAL — NETZLADEGERÄT</text>
<text x="58" y="458" class="t">2× 500-W-Ladegerät</text>
<text x="58" y="480" class="s">230 V AC → 52–58 V DC, 10 A</text>
<text x="58" y="502" class="s">nur nutzen, wenn der Bordlader aus</text>
<text x="58" y="520" class="s">ist — sonst arbeiten zwei Regler</text>
<text x="58" y="538" class="s">gegeneinander. Zusammen ≤ 20 A.</text>
<line x1="370" y1="448" x2="470" y2="448" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
<rect x="470" y="430" width="52" height="36" rx="5" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="496" y="454" class="v" text-anchor="middle" fill="#c2410c">F3</text>
<text x="496" y="422" class="s" text-anchor="middle">20 A</text>
<line x1="522" y1="448" x2="715" y2="448" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
<circle cx="775" cy="448" r="9" fill="#ffffff"/>
<circle cx="715" cy="448" r="5.5" fill="#c2410c" stroke="#ffffff" stroke-width="2"/>
<circle cx="715" cy="528" r="9" fill="#ffffff"/>
<line x1="370" y1="528" x2="775" y2="528" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
<circle cx="775" cy="528" r="5.5" fill="#111827" stroke="#ffffff" stroke-width="2"/>

<!-- ═════════ Legende ═════════ -->
<line x1="40" y1="628" x2="1290" y2="628" stroke="#e2e8f0" stroke-width="2"/>
<text x="40" y="660" class="h">LEGENDE</text>
<line x1="40" y1="692" x2="86" y2="692" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
<text x="96" y="696" class="s">DC-Plus 16 mm² (rot)</text>
<line x1="300" y1="692" x2="346" y2="692" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
<text x="356" y="696" class="s">DC-Minus 16 mm² (schwarz)</text>
