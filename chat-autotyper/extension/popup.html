<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Chat AutoTyper AI</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      margin: 0;
      width: 340px;
      background: #0f172a;
      color: #f8fafc;
      padding: 14px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .badge {
      font-size: 10px;
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .btn {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .btn:hover { background: #334155; }
    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      border-color: #38bdf8;
      color: #fff;
      padding: 9px 12px;
      margin-bottom: 12px;
    }
    .field { margin-bottom: 9px; }
    .field label {
      display: block;
      font-size: 11px;
      color: #cbd5e1;
      margin-bottom: 4px;
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      background: #090d16;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 7px 9px;
      font-size: 12px;
      outline: none;
    }
    textarea { min-height: 60px; resize: vertical; }
    .msg {
      margin-top: 8px;
      font-size: 11.5px;
      color: #34d399;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⌨️ Chat AutoTyper AI</div>
    <span class="badge">Kein Auto-Send</span>
  </div>

  <div class="grid">
    <button class="btn" id="btn-pick-chat">🎯 Chatverlauf wählen</button>
    <button class="btn" id="btn-pick-input">⌨️ Eingabefeld wählen</button>
  </div>

  <button class="btn btn-primary" id="btn-run-now">⚡ Jetzt lesen & Buchstabe für Buchstabe tippen</button>

  <div class="field">
    <label>KI-Anbieter</label>
    <select id="provider">
      <option value="openai">OpenAI (ChatGPT)</option>
      <option value="anthropic">Anthropic (Claude)</option>
      <option value="gemini">Google Gemini</option>
      <option value="demo">Lokaler Demo-Modus (ohne Key)</option>
    </select>
  </div>

  <div class="field">
    <label>API-Key</label>
    <input type="password" id="apiKey" placeholder="sk-... / AIza..." />
  </div>

  <div class="field">
    <label>Modell</label>
    <input type="text" id="model" placeholder="gpt-4o-mini" />
  </div>

  <div class="field">
    <label>System-Prompt</label>
    <textarea id="systemPrompt"></textarea>
  </div>

  <button class="btn" id="btn-save" style="width:100%;">💾 Einstellungen speichern</button>
  <div class="msg" id="save-msg">✅ Gespeichert!</div>

  <script src="popup.js"></script>
</body>
</html>
